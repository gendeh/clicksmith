<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clicksmith Overlay</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="overlay">
      <div class="overlay-card">
        <div>
          <strong>Clicksmith</strong>
          <div class="pill">Overlay controls</div>
        </div>
        <div class="overlay-actions">
          <button class="btn btn-primary" id="overlayRecord">Record</button>
          <button class="btn" id="overlayPlay">Play</button>
        </div>
        <button class="btn" id="overlayTakeover">Takeover</button>
      </div>
    </div>
    <script src="scripts/app.js"></script>
  </body>
</html>
