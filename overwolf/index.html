<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clicksmith (Overwolf)</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <div class="panel">
        <h1>Clicksmith</h1>
        <div class="pill">Overwolf controller window</div>
      </div>
      <div class="panel">
        <h2>Controls</h2>
        <button class="btn btn-primary" id="recordBtn">Start Recording (F9)</button>
        <button class="btn" id="playBtn">Start Playback (F10)</button>
        <button class="btn" id="takeoverBtn">Takeover (F11)</button>
      </div>
      <div class="panel">
        <h2>Status</h2>
        <div id="statusText" class="pill">Idle</div>
      </div>
    </div>
    <script src="scripts/app.js"></script>
  </body>
</html>
