name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install backend deps
        run: cd backend && npm install
      - name: Test backend
        run: cd backend && npm test

  image-service-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install deps
        run: |
          cd image-service
          pip install -r requirements.txt
      - name: Pytest
        run: |
          cd image-service
          PYTHONPATH=. pytest -q

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install deps
        run: |
          npm install
          cd client
          npm install
      - name: Build and package
        run: |
          cd client
          npm run build
          npm run package:dir
