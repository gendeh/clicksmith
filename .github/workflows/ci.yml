name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check process boundaries
        run: bash scripts/check-boundaries.sh

  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install backend deps
        run: npm --prefix backend install
      - name: Test backend
        run: npm --prefix backend test
      - name: Install client deps without native addons
        run: npm --prefix client install --ignore-scripts
      - name: Test client engines
        run: npm --prefix client test

  image-service-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install deps
        run: |
          cd image-service
          pip install -r requirements.txt
      - name: Pytest
        run: |
          cd image-service
          PYTHONPATH=. pytest -q

  verify-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install verify stack
        run: bash scripts/cloud-install.sh
      - name: Launch, doctor, drive manager-controls
        run: |
          export CLICKSMITH_VERIFY_DIR=/tmp/clicksmith-verify/ci
          export CLICKSMITH_BACKEND_PORT=3000
          export CLICKSMITH_IMAGE_PORT=5001
          export CLICKSMITH_RENDERER_PORT=5173
          node .cursor/skills/verify-clicksmith/scripts/control-clicksmith.mjs launch --lane all
          node .cursor/skills/verify-clicksmith/scripts/control-clicksmith.mjs doctor
          node .cursor/skills/verify-clicksmith/scripts/control-clicksmith.mjs drive manager-controls
          test -f .cursor/skills/verify-clicksmith/artifacts/manager-controls/proof.json
          node .cursor/skills/verify-clicksmith/scripts/control-clicksmith.mjs cleanup
      - name: Upload verify evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-clicksmith-manager-controls
          path: |
            .cursor/skills/verify-clicksmith/artifacts/manager-controls/
            /tmp/clicksmith-verify/ci/*.log
          if-no-files-found: warn

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install deps
        run: |
          npm install
          cd client
          npm install
      - name: Build and package
        run: |
          cd client
          npm run build
          npm run package:dir
